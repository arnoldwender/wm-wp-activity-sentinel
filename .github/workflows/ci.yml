name: CI Enterprise Security & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-security:
    name: Security, Linting & Quality Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The plugin header requires PHP 8.2; only 8.3 was tested until 2026-09-15.
        php-version: ['8.2', '8.3']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, json, mysqli

      - name: Syntax Linting (PHP Parallel Lint)
        run: |
          find . -name "*.php" ! -path "./vendor/*" -exec php -l {} +

      - name: Verify ABSPATH guards
        run: |
          echo "Verifying ABSPATH direct execution guards..."
          for file in $(find includes -name "*.php"); do
            if ! grep -q "defined( 'ABSPATH' )" "$file"; then
              echo "Error: Missing ABSPATH check in $file"
              exit 1
            fi
          done
          echo "All PHP classes properly guarded with ABSPATH."

      - name: Run Standalone Test Suites
        # Explicit entry points, not a glob: the other files in tests/ need WordPress (wp eval-file)
        # and exit 1 outside it on purpose.
        # Exit 0 alone is not green: a PHP file that leaves PHP mode early prints its source and exits 0
        # without running an assertion. The standalone suite must also print its results line.
        run: |
          set +e
          out=$(php tests/test-suite.php 2>&1); code=$?
          set -e
          printf '%s\n' "$out"
          [ "$code" -eq 0 ]
          grep -Eq '^  TEST SUITE RESULTS: [1-9][0-9]* PASSED \| 0 FAILED$' <<<"$out"

      # `wp i18n make-pot` IS the definition of a fresh catalog in the step below, so wp-cli is a
      # hard requirement there rather than something it shrugs off. Into $HOME/bin, not the
      # workspace: an executable in the repo root would land in the copy the mutation runner makes.
      # No workflow input reaches these commands; the URL is a literal.
      - name: Install WP-CLI
        if: matrix.php-version == '8.3'
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$HOME/bin/wp"
          chmod +x "$HOME/bin/wp"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # 159 of the 285 translatable strings had no entry on 2026-09-20. tests/test-i18n.php checks
      # encoding and file presence, which stays true of a catalog that drifted away from the code.
      - name: Translation catalog freshness
        if: matrix.php-version == '8.3'
        run: php tests/test-pot-freshness.php

      - name: Mutation Check
        # Each fix of 2026-09-15 undone once; the suite must turn red every time (control run first).
        run: bash tests/run-mutations.sh

      - name: Compliance & Security Audit
        run: python3 .github/scripts/security-audit.py

      - name: CRA / SBOM Validation
        run: |
          # El mandato SBOM del Cyber Resilience Act aplica desde el 2027-12-11.
          # Hasta que la flota tenga SBOMs esto avisa, no rompe el build.
          if [ ! -f "bom.json" ]; then
            echo "::warning::bom.json (SBOM) ausente — pendiente para el CRA (2027-12-11)."
          else
            echo "bom.json presente."
          fi
